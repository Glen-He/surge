name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/surge_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://127.0.0.1:3000
      SHARE_SECRET: ci-only-share-secret-at-least-32-characters
      SHARE_TOKEN_ENCRYPTION_KEY: ci-only-share-token-encryption-key-at-least-32-characters
      MAINTENANCE_SECRET: ci-only-maintenance-secret-at-least-32-characters
      SMTP_HOST: localhost
      SMTP_PORT: 465
      SMTP_USER: ci@example.test
      SMTP_PASS: ci-only-password
      REPORTS_DATA_DIR: /tmp/surge-report-data
      SURGE_DB_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d surge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
