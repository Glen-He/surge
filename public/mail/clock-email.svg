<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 邮件时钟图标矢量源：渲染为 clock-email.png（CID 附件）随邮件发送
       渲染命令：sharp(Buffer.from(svg), { density: 288 }).resize(40, 40).png()
       配色与 icon-email.png（苹果主体）统一为 #FF5656 -->
  <g fill="none" stroke="#FF5656" stroke-linecap="round">
    <circle cx="20" cy="20" r="18" stroke-width="4"/>
    <line x1="20" y1="11.5" x2="20" y2="20" stroke-width="3.5"/>
    <line x1="20" y1="20" x2="27.8" y2="24.5" stroke-width="3.5"/>
  </g>
  <circle cx="20" cy="20" r="2.4" fill="#FF5656"/>
</svg>
